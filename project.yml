name: RPGPlayer
options:
  bundleIdPrefix: com.calpinlabs
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  RPGPlayer:
    type: application
    platform: iOS
    sources:
      - path: RPGPlayer
        excludes:
          - Fixtures/Imports/CDFv2
          - Fixtures/Providers
      - path: Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: RPGPlayer
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
            CFBundleIconIsPrerendered: false
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
            CFBundleIconIsPrerendered: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.calpinlabs.rpgplayer.turn
            CFBundleURLSchemes:
              - rpgplayer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/RPGPlayer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calpinlabs.rpgplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: X6PM238Q98
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "RPGPlayer App Store 20260813"
    dependencies:
      - target: TurnActivityExtension
      - package: ZIPFoundation
  TurnActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - TurnActivityExtension
      - Shared
    info:
      path: Config/TurnActivityExtension-Info.plist
      properties:
        CFBundleDisplayName: RPGPlayer Turn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calpinlabs.rpgplayer.turn-activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: X6PM238Q98
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "RPGPlayer Turn Activity App Store 20260813"
  RPGPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RPGPlayerTests]
    dependencies:
      - target: RPGPlayer
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RPGPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RPGPlayerUITests]
    dependencies:
      - target: RPGPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RPGPlayer:
    build:
      targets:
        RPGPlayer: all
    test:
      targets:
        - RPGPlayerTests
        - RPGPlayerUITests
