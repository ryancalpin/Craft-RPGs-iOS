name: RPGPlayer
options:
  bundleIdPrefix: com.calpinlabs
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  RPGPlayer:
    type: application
    platform: iOS
    sources: [RPGPlayer, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: RPGPlayer
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.calpinlabs.rpgplayer.turn
            CFBundleURLSchemes:
              - rpgplayer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/RPGPlayer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calpinlabs.rpgplayer
    dependencies:
      - target: TurnActivityExtension
      - package: ZIPFoundation
  TurnActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - TurnActivityExtension
      - Shared
    info:
      path: Config/TurnActivityExtension-Info.plist
      properties:
        CFBundleDisplayName: RPGPlayer Turn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calpinlabs.rpgplayer.turn-activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  RPGPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RPGPlayerTests]
    dependencies:
      - target: RPGPlayer
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RPGPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RPGPlayerUITests]
    dependencies:
      - target: RPGPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RPGPlayer:
    build:
      targets:
        RPGPlayer: all
    test:
      targets:
        - RPGPlayerTests
        - RPGPlayerUITests
